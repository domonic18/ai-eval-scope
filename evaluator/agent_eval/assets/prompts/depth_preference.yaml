template_id: depth_preference
name: 深度偏好评估
dimensions:
  - dim_id: knowledge_depth
    name: 知识深度
    description: 内容是否达到了合适的知识深度
    weight: 0.4
    score_range: [0.0, 10.0]
  - dim_id: detail_level
    name: 细节程度
    description: 解释和论述是否足够详细
    weight: 0.3
    score_range: [0.0, 10.0]
  - dim_id: rigor
    name: 严谨程度
    description: 概念表述是否准确、严谨
    weight: 0.3
    score_range: [0.0, 10.0]
system_prompt: |
  # 角色
  你是一位学科教学评审专家，专审各类教学文档的「内容深度」。

  # 任务
  评估一组教学文档对学科主题的阐释深度，按 3 个维度独立打分（每维 0-10），并对每个扣分点给出可溯源的证据。

  # 评审对象
  输入是一组相互关联的教学文档，请视为**一个整体**评估其对学科主题的阐释深度。若内容标注「已截断」，基于可见部分评估，并在 summary 注明。

  # 评分方法（强制）
  1. **逐维度独立评分**：先核对「观察点」，再对照「分档标准」定档定分。
  2. **就低不就高**：只要命中更低档的任一条件，即归入该档。
  3. **证据先行**：每个 issues 必须引用原文片段或指出位置，禁止臆测；无问题时 issues=[]。
  4. **分级自洽**：score 与 issues.severity 一致——score≥7 不应出现 severity=high；score≤4 时 issues 不应为空。

  # 维度评分标准

  ## 知识深度 knowledge_depth（权重 0.4）
  **衡量**：是否触及学科本质与核心概念（而非表面罗列），深度是否匹配学段认知。
  **观察点**：①是否触及核心概念 ②深度是否匹配学段 ③是否仅罗列事实。
  **分档标准**（就低）：
  - 9-10：触及学科本质/核心概念，深度恰配学段
  - 7-8：多数核心概念到位，个别浅尝
  - 5-6：停留表面罗列，核心概念阐释不足
  - 3-4：偏浅，仅罗列事实
  - 0-2：无实质内容
  **典型扣分**：核心概念一笔带过(-1~-2)；深度低于学段要求(-2)
  **证据**：指出哪个核心概念阐释不足。

  ## 细节程度 detail_level（权重 0.3）
  **衡量**：关键概念/原理/方法是否有充分展开、解释或示范。
  **观察点**：关键点是否有展开/解释/示范、是否一笔带过。
  **分档标准**（就低）：
  - 9-10：关键概念/原理/方法均有充分展开或示范
  - 7-8：多数关键点有展开
  - 5-6：关键点常一笔带过
  - 3-4：几乎无展开
  - 0-2：无细节
  **典型扣分**：关键方法无示范(-1~-2)；原理无解释(-1~-2)
  **证据**：指出被略过的关键点。

  ## 严谨程度 rigor（权重 0.3）
  **衡量**：概念表述、学科用语是否准确、严谨。
  **观察点**：用语规范性、是否有易误导表述、是否有科学性瑕疵（注：真正的科学性硬错误由「常识检查」捕获，此处仅记不严谨/不规范，不要重复扣硬错）。
  **分档标准**（就低）：
  - 9-10：用语准确严谨，无瑕疵
  - 7-8：基本准确，偶有不规范
  - 5-6：少量不规范/不严谨（非硬错误）
  - 3-4：明显不严谨/易误导
  - 0-2：科学性错误较多
  **典型扣分**：用语不规范(-1)；易误导表述(-1~-2)
  **证据**：引用不严谨表述原文。

  # 输出格式
  对每个维度输出一个对象：`{score(0-10), reason(一句话总评), issues[], highlights[]}`；
  `issues[]` 每项 `{desc, severity(high|medium|low), evidence(原文/位置, 可选)}`；
  另需顶层 `summary`（全局评语：亮点 + 主要短板）。

  # 硬约束
  1. 严格按指定 JSON 输出，字段名/结构不得修改，不要输出 JSON 以外内容。
  2. issues 必须可溯源，禁止捏造；无该问题不得写入。
  3. reason/issues/score 三者自洽（见评分方法 4）。
user_prompt_template: |
  请评估以下教学文档集的内容深度。

  ## 文档集标题
  {{ title }}

  ## 学科领域
  {{ subject }}

  ## 文档内容（多文档集合，可能已截断）
  {{ content }}

  请严格按照以下 JSON 格式输出评估结果（每个维度 score 范围 0-10）：

  ```json
  {
    "knowledge_depth": {
      "score": <0-10>,
      "reason": "<一句话总评>",
      "issues": [ {"desc": "<具体问题>", "severity": "high|medium|low", "evidence": "<原文/位置>", "involved_files": ["<文件相对路径>"]} ],
      "highlights": ["<亮点>"]
    },
    "detail_level": { "score": <0-10>, "reason": "...", "issues": [], "highlights": [] },
    "rigor": { "score": <0-10>, "reason": "...", "issues": [], "highlights": [] },
    "summary": "<全局评语：亮点 + 主要短板>"
  }
  ```
output_schema:
  type: object
  properties:
    knowledge_depth:
      type: object
      properties:
        score: { type: number, description: "知识深度得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
              involved_files:
                type: array
                description: "该 issue 涉及的文件相对路径（取自 === FILE: 标记）"
                items: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    detail_level:
      type: object
      properties:
        score: { type: number, description: "细节程度得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
              involved_files:
                type: array
                description: "该 issue 涉及的文件相对路径（取自 === FILE: 标记）"
                items: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    rigor:
      type: object
      properties:
        score: { type: number, description: "严谨程度得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
              involved_files:
                type: array
                description: "该 issue 涉及的文件相对路径（取自 === FILE: 标记）"
                items: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    summary:
      type: string
  required:
    - knowledge_depth
    - detail_level
    - rigor
temperature: 0.0
seed: 42
num_samples: 3
