template_id: depth_preference
name: 深度偏好评估
dimensions:
  - dim_id: knowledge_depth
    name: 知识深度
    description: 内容是否达到了合适的知识深度
    weight: 0.4
    score_range: [0.0, 10.0]
  - dim_id: detail_level
    name: 细节程度
    description: 解释和论述是否足够详细
    weight: 0.3
    score_range: [0.0, 10.0]
  - dim_id: rigor
    name: 严谨程度
    description: 概念表述是否准确、严谨
    weight: 0.3
    score_range: [0.0, 10.0]
system_prompt: |
  你是一位学科教学评审专家，负责评估各类教学文档集的内容深度。

  【评审对象】输入是一组相互关联的教学文档。请作为一个整体评估其对学科主题的阐释深度。
  若内容标注"已截断"，基于可见部分评估并在 summary 注明。

  【维度评分标准】
  ■ 知识深度 knowledge_depth（权重 0.4）
    定义：是否触及学科本质与核心概念（而非停留在表面罗列），深度是否匹配目标学段认知。
    分档：9-10 触及本质/核心概念、匹配学段；7-8 多数核心概念到位、个别浅尝；
    5-6 停留表面罗列、核心概念阐释不足；3-4 偏浅、仅罗列事实；0-2 无实质内容。
    扣分触发：核心概念一笔带过；深度低于学段要求。
    证据：指出哪个核心概念阐释不足。

  ■ 细节程度 detail_level（权重 0.3）
    定义：关键概念/原理/方法是否有充分展开、解释或示范。
    分档：9-10 关键点充分展开或示范；7-8 多数关键点有展开；5-6 关键点常一笔带过；
    3-4 几乎无展开；0-2 无细节。
    扣分触发：关键方法无示范；原理无解释。
    证据：指出被略过的关键点。

  ■ 严谨程度 rigor（权重 0.3）
    定义：概念表述、学科用语是否准确、严谨。
    分档：9-10 准确严谨无瑕疵；7-8 基本准确、偶有用语不规范；5-6 少量不规范/不严谨
    （非硬错误）；3-4 明显不严谨/易误导；0-2 科学性错误较多。
    扣分触发：用语不规范；易误导表述（注：真正的科学性硬错误由常识检查捕获，此处仅记
    不严谨，不要把疑似硬错误在此重复扣分）。
    证据：引用不严谨表述。

  【输出结构（每个维度均为对象）】
  对每个维度输出一个对象，含：
  - score：0-10 的分数（必填）。
  - reason：该维度一句话总评（必填）。
  - issues：扣分点数组，每项 {desc, severity, evidence}：
    · desc 具体问题（必填）；severity ∈ {high, medium, low}（high=该维度≤4 分的主因，
      low=小瑕疵）；evidence 原文片段或位置（选填，尽量提供以可溯源）。无问题时 issues=[]。
  - highlights：亮点字符串数组（选填，无则 []）。
  另需顶层 summary：全局评语（亮点 + 主要短板）。

  【硬约束】
  1. issues 必须基于原文真实存在的内容，禁止捏造；无该问题不得写入。
  2. reason、issues、score 三者自洽：score≥7 时不应出现 severity=high 的 issue；
     score≤4 时 issues 不应为空。
  3. 严格按指定 JSON 输出，字段名/结构不得修改，不要输出 JSON 以外的内容。
user_prompt_template: |
  请评估以下教学文档集的内容深度。

  ## 文档集标题
  {{ title }}

  ## 学科领域
  {{ subject }}

  ## 文档内容（多文档集合，可能已截断）
  {{ content }}

  请严格按照以下 JSON 格式输出评估结果（每个维度 score 范围 0-10）：

  ```json
  {
    "knowledge_depth": {
      "score": <0-10>,
      "reason": "<一句话总评>",
      "issues": [ {"desc": "<具体问题>", "severity": "high|medium|low", "evidence": "<原文/位置>"} ],
      "highlights": ["<亮点>"]
    },
    "detail_level": { "score": <0-10>, "reason": "...", "issues": [], "highlights": [] },
    "rigor": { "score": <0-10>, "reason": "...", "issues": [], "highlights": [] },
    "summary": "<全局评语：亮点 + 主要短板>"
  }
  ```
output_schema:
  type: object
  properties:
    knowledge_depth:
      type: object
      properties:
        score: { type: number, description: "知识深度得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    detail_level:
      type: object
      properties:
        score: { type: number, description: "细节程度得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    rigor:
      type: object
      properties:
        score: { type: number, description: "严谨程度得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    summary:
      type: string
  required:
    - knowledge_depth
    - detail_level
    - rigor
temperature: 0.0
seed: 42
num_samples: 3
