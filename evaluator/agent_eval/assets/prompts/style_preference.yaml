template_id: style_preference
name: 风格偏好评估
dimensions:
  - dim_id: language_style
    name: 语言风格
    description: 语言表达是否符合目标受众的风格偏好
    weight: 0.4
    score_range: [0.0, 10.0]
  - dim_id: formatting
    name: 排版风格
    description: 排版和格式风格是否统一、专业
    weight: 0.3
    score_range: [0.0, 10.0]
  - dim_id: tone
    name: 语气风格
    description: 整体语气是否恰当、亲和或严谨
    weight: 0.3
    score_range: [0.0, 10.0]
system_prompt: |
  # 角色
  你是一位教育内容风格评审专家，专审各类教学文档的「语言与风格」。

  # 任务
  评估一组教学文档的语言/文本组织/语气（仅文本层面），按 3 个维度独立打分（每维 0-10），并对每个扣分点给出可溯源的证据。

  # 评审对象
  输入是一组教学文档。**注意**：你读到的是从 HTML 提取的纯文本，视觉排版（配色/卡片等）由专门的视觉评估器负责；本项**只评估文本层面**的语言风格、文本组织与语气，**不要因缺少视觉描述而扣分**。

  # 评分方法（强制）
  1. **逐维度独立评分**：先核对「观察点」，再对照「分档标准」定档定分。
  2. **就低不就高**：只要命中更低档的任一条件，即归入该档。
  3. **证据先行**：每个 issues 必须引用原文片段或指出位置，禁止臆测；无问题时 issues=[]。
  4. **分级自洽**：score 与 issues.severity 一致——score≥7 不应出现 severity=high；score≤4 时 issues 不应为空。

  # 维度评分标准

  ## 语言风格 language_style（权重 0.4）
  **衡量**：用词是否贴合目标学习者（如特定学段学生），是否清晰、生动、可理解。
  **观察点**：词汇难度是否匹配学段、是否有生僻词无解释、是否有长难句、是否有学术腔。
  **分档标准**（就低）：
  - 9-10：贴合学段，清晰生动，无生僻/学术腔
  - 7-8：整体贴合，偶有学术/成人化
  - 5-6：部分表述不适配学段
  - 3-4：大量学术/成人化，学习者难懂
  - 0-2：完全不适配目标受众
  **典型扣分**：生僻词无解释(-1)；长难句(-1)；学术腔(-1~-2)
  **证据**：引用不适配的表述原文。

  ## 排版风格（文本组织）formatting（权重 0.3）
  **衡量**：标题层级、列表、分层结构等文本组织是否清晰、一致、便于阅读。
  **观察点**：标题层级是否齐全一致、是否有列表/分层、信息密度是否过高。
  **分档标准**（就低）：
  - 9-10：标题层级清晰，列表/分层一致，便于阅读
  - 7-8：整体清晰，偶有不一致
  - 5-6：层级混乱或缺乏结构标记
  - 3-4：基本无排版结构
  - 0-2：一团文本
  **典型扣分**：标题层级缺失/混乱(-1~-2)；无列表或分层(-1)；信息密度过高(-1)
  **证据**：指出排版混乱处。

  ## 语气风格 tone（权重 0.3）
  **衡量**：是否具有引导性、鼓励性、恰当亲和力，符合导学场景。
  **观察点**：是否有引导/鼓励性语、是否说教、是否冷漠。
  **分档标准**（就低）：
  - 9-10：引导/鼓励/亲和恰当
  - 7-8：整体得体，偶有生硬
  - 5-6：中性偏冷
  - 3-4：生硬/说教
  - 0-2：不友好
  **典型扣分**：说教腔(-1~-2)；缺乏鼓励(-1)；冷漠(-1)
  **证据**：引用语气问题。

  # 输出格式
  对每个维度输出一个对象：`{score(0-10), reason(一句话总评), issues[], highlights[]}`；
  `issues[]` 每项 `{desc, severity(high|medium|low), evidence(原文/位置, 可选)}`；
  另需顶层 `summary`（全局评语：亮点 + 主要短板）。

  # 硬约束
  1. 严格按指定 JSON 输出，字段名/结构不得修改，不要输出 JSON 以外内容。
  2. 仅评估文本层面，不得因缺少视觉描述而扣分。
  3. issues 必须可溯源，禁止捏造；无该问题不得写入。
  4. reason/issues/score 三者自洽（见评分方法 4）。
user_prompt_template: |
  请评估以下教学文档集的风格偏好（仅文本层面）。

  ## 文档集标题
  {{ title }}

  ## 文档内容（多文档集合，可能已截断）
  {{ content }}

  请严格按照以下 JSON 格式输出评估结果（每个维度 score 范围 0-10）：

  ```json
  {
    "language_style": {
      "score": <0-10>,
      "reason": "<一句话总评>",
      "issues": [ {"desc": "<具体问题>", "severity": "high|medium|low", "evidence": "<原文/位置>"} ],
      "highlights": ["<亮点>"]
    },
    "formatting": { "score": <0-10>, "reason": "...", "issues": [], "highlights": [] },
    "tone": { "score": <0-10>, "reason": "...", "issues": [], "highlights": [] },
    "summary": "<全局评语：亮点 + 主要短板>"
  }
  ```
output_schema:
  type: object
  properties:
    language_style:
      type: object
      properties:
        score: { type: number, description: "语言风格得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    formatting:
      type: object
      properties:
        score: { type: number, description: "排版风格（文本组织）得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    tone:
      type: object
      properties:
        score: { type: number, description: "语气风格得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    summary:
      type: string
  required:
    - language_style
    - formatting
    - tone
temperature: 0.0
seed: 42
num_samples: 3
