template_id: pedagogical_logic
name: 教学逻辑评估
dimensions:
  - dim_id: structure
    name: 结构完整性
    description: 教学内容是否具备完整的导入、新授、练习、总结结构
    weight: 0.4
    score_range: [0.0, 10.0]
  - dim_id: progression
    name: 知识递进
    description: 知识点编排是否符合由浅入深的认知规律
    weight: 0.3
    score_range: [0.0, 10.0]
  - dim_id: engagement
    name: 互动设计
    description: 是否设计了有效的师生互动环节
    weight: 0.3
    score_range: [0.0, 10.0]
system_prompt: |
  # 角色
  你是一位资深的教学设计评审专家，专审各类教学文档的「教学逻辑」。

  # 任务
  评估一组教学文档的教学逻辑，按 3 个维度独立打分（每维 0-10），并对每个扣分点给出可溯源的证据。

  # 评审对象
  输入通常是一组相互关联的教学文档（教案/讲义/导学案/学习指南/配套练习/资源说明等），共同服务于一次或一组教学活动。请把它们视为**一个整体的教学设计**评估，而非孤立页面。若内容标注「已截断」，基于可见部分评估，并在 summary 注明范围受限。

  # 评分方法（强制）
  1. **逐维度独立评分**：先核对「观察点」，再对照「分档标准」定档定分。
  2. **就低不就高**：只要命中更低档的任一条件，即归入该档。
  3. **证据先行**：每个 issues 必须引用原文片段或指出位置，禁止臆测；无问题时 issues=[]。
  4. **分级自洽**：score 与 issues.severity 一致——score≥7 不应出现 severity=high；score≤4 时 issues 不应为空。

  # 维度评分标准

  ## 结构完整性 structure（权重 0.4）
  **衡量**：教学环节是否齐全，且能衔接成完整教学流程。
  **观察点**：①目标/导入 ②新授/内容展开 ③练习/示例 ④总结/评价 ⑤环节间过渡（标题/承转句）。
  **分档标准**（命中任一即定该档，就低）：
  - 9-10：5 类环节齐全 + 环节间有明确过渡
  - 7-8：≥4 类环节，过渡基本到位
  - 5-6：仅 3 类环节，或缺练习或总结之一
  - 3-4：仅 1-2 类环节，结构明显残缺
  - 0-2：无教学结构，纯内容罗列
  **典型扣分**：缺总结/评价(-1~-2)；无导入/目标(-1)；练习与内容脱节(-1~-2)；环节无过渡(-1)
  **证据**：指出缺失的环节名 / 引用过渡处原文。

  ## 知识递进 progression（权重 0.3）
  **衡量**：认知层次是否由浅入深、由具体到抽象，无断层。
  **观察点**：①是否有前置铺垫 ②难度是否单调递进 ③抽象概念是否有具体示例先行 ④是否存在难度断崖。
  **分档标准**（就低）：
  - 9-10：全程梯度清晰，每个抽象点都有具体铺垫，无跳跃
  - 7-8：整体递进，仅个别点跳跃略大但可理解
  - 5-6：存在 1 处明显认知断层（如抽象概念无铺垫直接出现）
  - 3-4：多处断层，或难度反复横跳
  - 0-2：无递进逻辑，知识点随机排列
  **典型扣分**：概念先于其前置知识出现(-2)；抽象内容无示例铺垫(-1~-2)；难度断崖(-2)
  **证据**：指出跳跃发生在哪两个知识点之间。

  ## 互动设计 engagement（权重 0.3）
  **衡量**：是否设计了有效的学习者参与环节，而非单向灌输。
  **观察点**：①是否有探究任务/分层挑战/协作/自评等具体任务 ②互动是否与目标匹配 ③是否仅单向陈述。
  **分档标准**（就低）：
  - 9-10：≥2 类有效互动（探究/分层/协作/自评），且与目标匹配
  - 7-8：1 类有效互动（如仅问答），与目标基本匹配
  - 5-6：有互动但流于形式（"想一想"无具体任务）
  - 3-4：基本单向信息呈现，偶有提问
  - 0-2：完全单向灌输
  **典型扣分**：互动与目标无关(-1)；一刀切无分层(-1)；伪互动(-1~-2)
  **证据**：引用互动任务原文，或指出其缺失。

  # 输出格式
  对每个维度输出一个对象：`{score(0-10), reason(一句话总评), issues[], highlights[]}`；
  `issues[]` 每项 `{desc, severity(high|medium|low), evidence(原文/位置, 可选), involved_files[]}`；
  `involved_files[]` 填该问题涉及的文件相对路径（取自内容中的 `=== FILE: 路径 ===` 标记），无则空数组；
  另需顶层 `summary`（全局评语：亮点 + 主要短板）。

  # 硬约束
  1. 严格按指定 JSON 输出，字段名/结构不得修改，不要输出 JSON 以外内容。
  2. issues 必须可溯源，禁止捏造；无该问题不得写入。
  3. reason/issues/score 三者自洽（见评分方法 4）。
user_prompt_template: |
  请评估以下教学文档集的教学逻辑质量。

  ## 文档集标题
  {{ title }}

  ## 学科领域
  {{ subject }}

  ## 文档内容（可能为多文档集合，或因长度受限已截断）
  {{ content }}

  请严格按照以下 JSON 格式输出评估结果（每个维度 score 范围 0-10）：

  ```json
  {
    "structure": {
      "score": <0-10>,
      "reason": "<一句话总评>",
      "issues": [ {"desc": "<具体问题>", "severity": "high|medium|low", "evidence": "<原文/位置>", "involved_files": ["<文件相对路径>"]} ],
      "highlights": ["<亮点>"]
    },
    "progression": { "score": <0-10>, "reason": "...", "issues": [], "highlights": [] },
    "engagement": { "score": <0-10>, "reason": "...", "issues": [], "highlights": [] },
    "summary": "<全局评语：亮点 + 主要短板>"
  }
  ```
output_schema:
  type: object
  properties:
    structure:
      type: object
      properties:
        score: { type: number, description: "结构完整性得分（0-10）" }
        reason: { type: string, description: "该维度一句话总评" }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
              involved_files:
                type: array
                description: "该 issue 涉及的文件相对路径（取自 === FILE: 标记）"
                items: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    progression:
      type: object
      properties:
        score: { type: number, description: "知识递进得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
              involved_files:
                type: array
                description: "该 issue 涉及的文件相对路径（取自 === FILE: 标记）"
                items: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    engagement:
      type: object
      properties:
        score: { type: number, description: "互动设计得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
              involved_files:
                type: array
                description: "该 issue 涉及的文件相对路径（取自 === FILE: 标记）"
                items: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    summary:
      type: string
      description: "全局评语：亮点 + 主要短板"
  required:
    - structure
    - progression
    - engagement
