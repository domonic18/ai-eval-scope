template_id: content_diversity
name: 内容多样性评估
dimensions:
  - dim_id: media_variety
    name: 媒体多样性
    description: 内容是否包含多种表达形式（文字、公式、表格、图片等）
    weight: 0.4
    score_range: [0.0, 10.0]
  - dim_id: topic_breadth
    name: 主题广度
    description: 是否覆盖了相关主题的多个方面
    weight: 0.3
    score_range: [0.0, 10.0]
  - dim_id: example_richness
    name: 示例丰富度
    description: 是否提供了丰富多样的示例和案例
    weight: 0.3
    score_range: [0.0, 10.0]
system_prompt: |
  你是一位教育内容评审专家，负责评估各类教学文档集的内容多样性。

  【评审对象】输入通常是一组相互关联的教学文档。请将它们视为一个整体集合评估多样性。
  注意：本评估针对的是文档所承载的"教学内容与表达形式"的多样性，而非源码样式。已提供的
  "已检测元素"是规则引擎对文本的预判（仅供参考，可能因正文提取而不全），请以你阅读到的
  实际内容为准。

  【维度评分标准】
  ■ 媒体多样性 media_variety（权重 0.4）
    定义：是否综合运用多种表达形式（分层任务/案例/图表描述/问题链/自评量表/资源索引等）。
    分档：9-10 用≥4 种且贴切；7-8 用 3 种较贴切；5-6 用 2 种、单一形式（纯文本）占主导；
    3-4 基本纯文本、偶有 1 种其他形式；0-2 纯文本堆砌。
    扣分触发：为多样而多样、形式与内容不匹配；本可图示却大段文字描述。
    证据：列出实际出现的表达形式种类。

  ■ 主题广度 topic_breadth（权重 0.3）
    定义：是否围绕文档主题覆盖多个有意义的子维度/视角。
    分档：9-10 覆盖多有意义子视角、无明显核心遗漏；7-8 主要子主题覆盖、个别有意义视角
    缺失；5-6 覆盖面较窄、仅 1-2 个子主题；3-4 偏离或仅触及主题表层；0-2 极窄/跑题。
    扣分触发：遗漏核心子主题；大量跑题内容。
    证据：列出已覆盖子主题 / 指出缺失的核心子主题。

  ■ 示例丰富度 example_richness（权重 0.3）
    定义：是否提供贴近学习者的多样化示例/情境/案例。
    分档：9-10 多样贴近学情（≥3 类）；7-8 有但类型较单一；5-6 示例少或距学情远；
    3-4 几乎无示例；0-2 无任何示例。
    扣分触发：示例不贴切学情；示例单一。
    证据：引用示例或指出缺失。

  【输出结构（每个维度均为对象）】
  对每个维度输出一个对象，含：
  - score：0-10 的分数（必填）。
  - reason：该维度一句话总评（必填）。
  - issues：扣分点数组，每项 {desc, severity, evidence}：
    · desc 具体问题（必填）；severity ∈ {high, medium, low}（high=该维度≤4 分的主因，
      low=小瑕疵）；evidence 原文片段或位置（选填，尽量提供以可溯源）。无问题时 issues=[]。
  - highlights：亮点字符串数组（选填，无则 []）。
  另需顶层 summary：全局评语（亮点 + 主要短板）。

  【硬约束】
  1. issues 必须基于原文真实存在的内容，禁止捏造；无该问题不得写入。
  2. reason、issues、score 三者自洽：score≥7 时不应出现 severity=high 的 issue；
     score≤4 时 issues 不应为空。
  3. 严格按指定 JSON 输出，字段名/结构不得修改，不要输出 JSON 以外的内容。
user_prompt_template: |
  请评估以下教学文档集的内容多样性。

  ## 文档集标题
  {{ title }}

  ## 文档内容（多文档集合，可能已截断）
  {{ content }}

  ## 规则引擎预检测的内容元素（仅供参考）
  - 公式：{{ has_formula }}
  - 表格：{{ has_table }}
  - 图片：{{ has_image }}
  - 列表：{{ has_list }}

  请严格按照以下 JSON 格式输出评估结果（每个维度 score 范围 0-10）：

  ```json
  {
    "media_variety": {
      "score": <0-10>,
      "reason": "<一句话总评>",
      "issues": [ {"desc": "<具体问题>", "severity": "high|medium|low", "evidence": "<原文/位置>"} ],
      "highlights": ["<亮点>"]
    },
    "topic_breadth": { "score": <0-10>, "reason": "...", "issues": [], "highlights": [] },
    "example_richness": { "score": <0-10>, "reason": "...", "issues": [], "highlights": [] },
    "summary": "<全局评语：亮点 + 主要短板>"
  }
  ```
output_schema:
  type: object
  properties:
    media_variety:
      type: object
      properties:
        score: { type: number, description: "媒体多样性得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    topic_breadth:
      type: object
      properties:
        score: { type: number, description: "主题广度得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    example_richness:
      type: object
      properties:
        score: { type: number, description: "示例丰富度得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    summary:
      type: string
  required:
    - media_variety
    - topic_breadth
    - example_richness
temperature: 0.0
seed: 42
num_samples: 3
