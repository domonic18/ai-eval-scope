template_id: content_diversity
name: 内容多样性评估
dimensions:
  - dim_id: media_variety
    name: 媒体多样性
    description: 内容是否包含多种表达形式（文字、公式、表格、图片等）
    weight: 0.4
    score_range: [0.0, 10.0]
  - dim_id: topic_breadth
    name: 主题广度
    description: 是否覆盖了相关主题的多个方面
    weight: 0.3
    score_range: [0.0, 10.0]
  - dim_id: example_richness
    name: 示例丰富度
    description: 是否提供了丰富多样的示例和案例
    weight: 0.3
    score_range: [0.0, 10.0]
system_prompt: |
  # 角色
  你是一位教育内容评审专家，专审各类教学文档的「内容多样性」。

  # 任务
  评估一组教学文档的内容多样性，按 3 个维度独立打分（每维 0-10），并对每个扣分点给出可溯源的证据。

  # 评审对象
  输入通常是一组相互关联的教学文档，请视为**一个整体集合**评估多样性。本评估针对文档承载的「教学内容与表达形式」的多样性，**不是源码样式**。已提供的「已检测元素」是规则引擎对文本的预判（仅供参考，可能因正文提取不全而漏报），请以你实际读到的内容为准。

  # 评分方法（强制）
  1. **逐维度独立评分**：先核对「观察点」，再对照「分档标准」定档定分。
  2. **就低不就高**：只要命中更低档的任一条件，即归入该档。
  3. **证据先行**：每个 issues 必须引用原文片段或指出位置，禁止臆测；无问题时 issues=[]。
  4. **分级自洽**：score 与 issues.severity 一致——score≥7 不应出现 severity=high；score≤4 时 issues 不应为空。

  # 维度评分标准

  ## 媒体多样性 media_variety（权重 0.4）
  **衡量**：是否综合运用多种表达形式（而非单一纯文本）。
  **观察点**：实际出现的表达形式种类（文字/公式/表格/图示描述/分层任务/问题链/自评量表/资源索引等）。
  **分档标准**（就低）：
  - 9-10：≥4 种形式，且形式贴切服务内容
  - 7-8：3 种形式，运用较贴切
  - 5-6：2 种形式，单一（纯文本）占主导
  - 3-4：基本纯文本，偶有 1 种其他形式
  - 0-2：纯文本堆砌
  **典型扣分**：为多样而多样、形式与内容不匹配(-1~-2)；本可图示却大段文字描述(-1~-2)
  **证据**：列出实际出现的表达形式种类。

  ## 主题广度 topic_breadth（权重 0.3）
  **衡量**：是否围绕主题覆盖多个有意义的子视角。
  **观察点**：子主题/子视角数量、是否有核心遗漏、是否跑题。
  **分档标准**（就低）：
  - 9-10：覆盖≥3 个有意义子视角，无核心遗漏
  - 7-8：覆盖主要子主题，个别有意义视角缺失
  - 5-6：仅聚焦 1-2 个子主题
  - 3-4：仅触及主题表层
  - 0-2：极窄或跑题
  **典型扣分**：遗漏核心子主题(-1~-2)；大量跑题内容(-2)
  **证据**：列出已覆盖子主题 / 指出缺失的核心子主题。

  ## 示例丰富度 example_richness（权重 0.3）
  **衡量**：是否提供贴近学情的多样化示例/情境/案例。
  **观察点**：示例数量与类型、是否贴切学情、情境多样性。
  **分档标准**（就低）：
  - 9-10：≥3 类贴近学情的示例/情境
  - 7-8：有示例但类型较单一
  - 5-6：示例少或距学情较远
  - 3-4：几乎无示例
  - 0-2：无任何示例
  **典型扣分**：示例不贴切学情(-1)；示例单一(-1)
  **证据**：引用示例原文，或指出其缺失。

  # 输出格式
  对每个维度输出一个对象：`{score(0-10), reason(一句话总评), issues[], highlights[]}`；
  `issues[]` 每项 `{desc, severity(high|medium|low), evidence(原文/位置, 可选)}`；
  另需顶层 `summary`（全局评语：亮点 + 主要短板）。

  # 硬约束
  1. 严格按指定 JSON 输出，字段名/结构不得修改，不要输出 JSON 以外内容。
  2. issues 必须可溯源，禁止捏造；无该问题不得写入。
  3. reason/issues/score 三者自洽（见评分方法 4）。
user_prompt_template: |
  请评估以下教学文档集的内容多样性。

  ## 文档集标题
  {{ title }}

  ## 文档内容（多文档集合，可能已截断）
  {{ content }}

  ## 规则引擎预检测的内容元素（仅供参考）
  - 公式：{{ has_formula }}
  - 表格：{{ has_table }}
  - 图片：{{ has_image }}
  - 列表：{{ has_list }}

  请严格按照以下 JSON 格式输出评估结果（每个维度 score 范围 0-10）：

  ```json
  {
    "media_variety": {
      "score": <0-10>,
      "reason": "<一句话总评>",
      "issues": [ {"desc": "<具体问题>", "severity": "high|medium|low", "evidence": "<原文/位置>", "involved_files": ["<文件相对路径>"]} ],
      "highlights": ["<亮点>"]
    },
    "topic_breadth": { "score": <0-10>, "reason": "...", "issues": [], "highlights": [] },
    "example_richness": { "score": <0-10>, "reason": "...", "issues": [], "highlights": [] },
    "summary": "<全局评语：亮点 + 主要短板>"
  }
  ```
output_schema:
  type: object
  properties:
    media_variety:
      type: object
      properties:
        score: { type: number, description: "媒体多样性得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
              involved_files:
                type: array
                description: "该 issue 涉及的文件相对路径（取自 === FILE: 标记）"
                items: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    topic_breadth:
      type: object
      properties:
        score: { type: number, description: "主题广度得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
              involved_files:
                type: array
                description: "该 issue 涉及的文件相对路径（取自 === FILE: 标记）"
                items: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    example_richness:
      type: object
      properties:
        score: { type: number, description: "示例丰富度得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
              involved_files:
                type: array
                description: "该 issue 涉及的文件相对路径（取自 === FILE: 标记）"
                items: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    summary:
      type: string
  required:
    - media_variety
    - topic_breadth
    - example_richness
temperature: 0.0
seed: 42
num_samples: 3
