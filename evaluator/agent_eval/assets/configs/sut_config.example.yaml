# sut_config v2 示例（复制为实际配置使用；凭证一律走环境变量，严禁写进本文件）
#
# env 命名约定：AGENT_EVAL_SUT__<CREDENTIAL_REF>__{USERNAME|PASSWORD|TOKEN}
#   例：credential_ref: MY_SUT → AGENT_EVAL_SUT__MY_SUT__USERNAME / __PASSWORD / __TOKEN
#
# 两种 protocol_flavor：
#   runs     — POST /runs/wait 族（Agent Protocol 参考实现形态）
#   commands — POST /threads/{id}/commands(run.start) + GET /threads/{id}/state
#              轮询 + SSE /threads/{id}/stream（官方 Streaming 端点 / AG-UI 网关形态）
sut:
  name: my-agent
  channel: agent_protocol
  base_url: https://agent.example.com
  protocol_flavor: runs # runs | commands
  exec_mode: wait # wait | background | stream
  timeout: 300
  # commands 形态：注入 run.start 的 config.configurable（如平台侧模型路由键）
  # configurable:
  #   modelId: "1"
  auth:
    type: api_login # none | static_token | api_login | session_cookie
    credential_ref: MY_SUT
    login:
      method: POST
      path: /api/users/login # 跨域登录接口可填完整 http(s):// URL
      body_template: '{"username": "{{ username }}", "password": "{{ password }}"}'
    extract:
      token_path: data.token # 登录响应中 token 的 JSON 点分路径
      token_type: Bearer # Bearer | cookie | header:<HeaderName>
  # 产出物提取（相对 run 终态 payload 的点分路径；缺省 commands 形态自动取末条 ai 文本）
  # output_paths:
  #   files_field: values.output_files
  #   text_field: values.content
