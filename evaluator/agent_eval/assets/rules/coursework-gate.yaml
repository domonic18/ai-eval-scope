version: "1.0"
description: "课件基础评估：格式门控 + 常识门控（LLM 二次确认），不含质量/视觉评估"

dimensions:
  - id: functional
    name: "功能性"
    weight: 1.0

cascade:
  - stage: format
    name: "格式门控"
    stop_on_fail: true
  - stage: commonsense
    name: "常识门控"
    stop_on_fail: false

rules:
  # ── format 门控（HARD_GATE，失败 -3 并阻塞后续）──
  - id: FMT_001
    name: "输出格式有效"
    dimension: functional
    stage: format
    description: "SUT 必须生成有效的 Markdown 或 HTML 文件"
    evaluator: format.response_format
    params:
      allowed_formats: ["md", "html"]
    weight: 1.0
    penalty_on_fail: -3

  - id: FMT_002
    name: "HTML 有效性"
    dimension: functional
    stage: format
    evaluator: format.html_validity
    params:
      check_html_only: true
    weight: 1.0

  # ── commonsense 门控（HARD_SCORE，失败归零本阶段但不阻塞）──
  - id: COMMON_INFO
    name: "知识准确性"
    dimension: functional
    stage: commonsense
    evaluator: commonsense.info_accuracy
    weight: 1.0
    enabled: true

  - id: COMMON_CHRONO
    name: "时序正确性"
    dimension: functional
    stage: commonsense
    evaluator: commonsense.chronological_order
    weight: 1.0
    enabled: true

  - id: COMMON_LOGIC
    name: "逻辑一致性"
    dimension: functional
    stage: commonsense
    evaluator: commonsense.logical_consistency
    weight: 1.0
    enabled: true
