# SasanAgent staging 被测系统（Agent Protocol commands 形态）
# 凭证经环境变量注入（不入库，值存放于本地 .env / 平台凭证库）：
#   AGENT_EVAL_SUT__SASAN__USERNAME / AGENT_EVAL_SUT__SASAN__PASSWORD
sut:
  name: sasan-agent
  channel: agent_protocol
  base_url: https://agent-server.staging.bj33smarter.com
  protocol_flavor: commands # /threads/{id}/commands + GET state 轮询（官方 Streaming 端点形态）
  exec_mode: wait
  timeout: 300
  configurable:
    modelId: "19" # 平台 userModelConfig 行 ID（KIMI / kimi-k3，userId 81）
  auth:
    type: api_login
    credential_ref: SASAN
    login:
      method: POST
      path: https://sasan-server.staging.bj33smarter.com/users/login # 登录域独立于 API 域
      body_template: '{"phone": "{{ username }}", "captcha": "{{ password }}", "platform": "fs"}'
    extract:
      token_path: token # 响应顶层 {"token": ...}
      token_type: Bearer
