# code 默认场景配置 — 代码生成场景的聚合策略与指标定义（跨语言单一源）
# 镜像 courseware policy.yaml 契约：aggregation_policy + metric_definitions

aggregation_policy:
  id: code-default
  scenario_id: code
  stage_weights:
    - stage_id: format
      weight: 1.0
      is_gate: true
    - stage_id: quality
      weight: 1.0
      is_gate: false
      skip_tiers_in_reward: [hard_gate, hard_score]
      id: quality
      evaluator_weights:
        code.correctness: 0.6
        code.style: 0.4
  normalize_to: [0.0, 1.0]

metric_definitions:
  - id: code:delivery_rate
    name: 交付合格率
    summary: 代码文件是否成功生成且为有效的 Python 文件
    expression: "count(format_gate) / total"
    threshold: 0.9
    unit: ratio
    explain:
      title: "交付合格率 · Delivery Rate"
      rows:
        - dt: 定义
          dd: "成功生成且格式有效的 Python 代码文件占比——连文件都不是 .py 就谈不上评估。"
          tone: primary
        - dt: 计算
          dd: "格式门控通过的样本数 ÷ 全部样本数"
        - dt: 标准
          dd: "达标线 ≥ 0.90；低于则交付不稳定。"
          tone: danger
  - id: code:quality
    name: 代码质量
    summary: 代码正确性与风格的综合质量评分
    expression: "mean(quality)"
    threshold: null
    unit: score
    explain:
      title: "代码质量 · Quality"
      rows:
        - dt: 定义
          dd: "代码正确性（0.6）与风格（0.4）加权平均的软质量分（独立指标，不混入综合得分）。"
          tone: primary
        - dt: 范围
          dd: "[0, 1]，越高越好"
  - id: code:reward
    name: 综合得分
    summary: 代码生成综合质量评分（格式门控 + 质量加权，归一化到 [0,1]）
    expression: "mean(reward)"
    threshold: 0.7
    unit: score
    explain:
      title: "综合得分 · Reward"
      rows:
        - dt: 定义
          dd: "归一化到 [0,1] 的综合质量分，融合格式门控与代码质量。"
          tone: primary
        - dt: 计算
          dd: "格式门控 + 代码质量加权（按 stage_weights）"
        - dt: 标准
          dd: "达标线 ≥ 0.70；代码生成质量合格。"
          tone: success
