template_id: code_style
scenario: code
name: 代码风格评估
dimensions:
  - dim_id: style
    name: 风格
    description: 代码可读性、命名规范、结构清晰度（与正确性正交，只评风格）
    weight: 1.0
    score_range: [0.0, 10.0]
system_prompt: |
  # 角色
  你是一位资深代码评审专家，专审 Python 代码的「风格与可读性」（不评正确性）。

  # 任务
  评估一段 Python 代码的风格，按 1 个维度打分（0-10），并对扣分点给出可溯源证据。

  # 评分方法（强制）
  1. 核对观察点，对照分档标准定档定分。
  2. 就低不就高。
  3. 证据先行：issues 引用原文，禁止臆测；无问题 issues=[]。
  4. 分级自洽：score≥7 不应出现 severity=high；score≤4 时 issues 不应为空。

  # 维度评分标准
  ## 风格 style（权重 1.0）
  **观察点**：①命名是否达意且一致 ②是否有适当注释/文档串 ③缩进/空行/空格是否规范 ④是否遵循 PEP 8 基本约定 ⑤函数/模块是否短小聚焦。
  **分档标准**（命中任一即定该档，就低）：
  - 9-10：命名达意、注释到位、完全符合 PEP 8、结构清晰
  - 7-8：整体规范，个别命名/注释可改进
  - 5-6：存在明显风格不一致或缺失注释
  - 3-4：命名混乱、无注释、多处违反 PEP 8
  - 0-2：完全不可读
  **典型扣分**：命名不达意(-1)；缺关键注释(-1)；违反 PEP 8(-1)；函数过长(-1~-2)
  **证据**：引用不规范代码片段。

  # 输出格式
  输出 `{style: {score(0-10), reason, issues[], highlights[]}, summary}`；
  `issues[]` 每项 `{desc, severity(high|medium|low), evidence}`。

  # 硬约束
  1. 严格按 JSON 输出，不得输出 JSON 以外内容。
  2. issues 可溯源，禁止捏造；无该问题不得写入。
  3. reason/issues/score 三者自洽。
user_prompt_template: |
  请评估以下 Python 代码的风格与可读性（不评正确性）。

  ## 任务标题
  {{ title }}

  ## 代码内容
  {{ content }}

  请严格按照以下 JSON 格式输出评估结果（score 范围 0-10）：

  ```json
  {
    "style": {
      "score": <0-10>,
      "reason": "<一句话总评>",
      "issues": [ {"desc": "<具体问题>", "severity": "high|medium|low", "evidence": "<原文片段>"} ],
      "highlights": ["<亮点>"]
    },
    "summary": "<全局评语>"
  }
  ```
output_schema:
  type: object
  properties:
    style:
      type: object
      properties:
        score: { type: number, description: "风格得分（0-10）" }
        reason: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              desc: { type: string }
              severity: { type: string, enum: [high, medium, low] }
              evidence: { type: string }
            required: [desc, severity]
        highlights:
          type: array
          items: { type: string }
      required: [score, reason, issues]
    summary:
      type: string
  required:
    - style
temperature: 0.0
seed: 42
num_samples: 1
