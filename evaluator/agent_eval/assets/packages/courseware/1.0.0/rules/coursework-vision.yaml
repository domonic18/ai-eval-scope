version: "1.0"
scenario: courseware
description: "课件完整评估：门控 + 质量评估 + 多模态视觉质量（executor 需预装 Chromium）"

dimensions:
  - id: functional
    name: "功能性"
    weight: 1.0
  - id: effectiveness
    name: "效果性"
    weight: 1.0

# cascade 定义阶段顺序与短路策略：stop_on_fail=true → 该阶段失败阻塞后续。
# 管线由 build_pipeline 据此 + rules 构建（stage id 与规则 stage 对齐）。
cascade:
  - stage: format
    name: "格式门控"
    stop_on_fail: true
  - stage: commonsense
    name: "常识门控"
    stop_on_fail: false
  - stage: quality
    name: "质量评估"
    stop_on_fail: false

rules:
  # ── format 门控（HARD_GATE，失败阻塞后续；S_format = 0，Reward 由 [0,1] 归一化体现）──
  - id: FMT_001
    name: "输出格式有效"
    dimension: functional
    stage: format
    description: "SUT 必须生成有效的 Markdown 或 HTML 文件"
    method: format
    format_type: extension
    extensions: ["md", "html"]
    evaluator: format.response_format
    weight: 1.0

  - id: FMT_002
    name: "HTML 有效性"
    dimension: functional
    stage: format
    method: format
    format_type: html_validity
    evaluator: format.html_validity
    params:
      check_html_only: true
    weight: 1.0

  # ── commonsense 门控（HARD_SCORE，失败归零本阶段但不阻塞）──
  - id: COMMON_INFO
    name: "知识准确性"
    dimension: functional
    stage: commonsense
    method: rule_set
    # 数据集留空 → 使用全部参考数据集（知识库）；可按需收敛到具体学科
    prompt_id: info_accuracy
    confirmation_prompt_id: fact_verdict
    evaluator: commonsense.info_accuracy
    weight: 1.0
    enabled: true

  - id: COMMON_CHRONO
    name: "时序正确性"
    dimension: functional
    stage: commonsense
    method: llm
    prompt_id: chronological_order
    evaluator: commonsense.chronological_order
    weight: 1.0
    enabled: true   # 不关注时序的课件改 false 即禁用

  - id: COMMON_LOGIC
    name: "逻辑一致性"
    dimension: functional
    stage: commonsense
    method: llm
    prompt_id: logical_consistency
    evaluator: commonsense.logical_consistency
    weight: 1.0
    enabled: true

  # ── quality 软约束/偏好（SOFT/PREFERENCE，effectiveness 维度，LLM Judge）──
  - id: SOFT_LOGIC
    name: "教学逻辑"
    dimension: effectiveness
    stage: quality
    method: llm
    prompt_id: pedagogical_logic
    evaluator: soft.teaching_logic
    weight: 1.0

  - id: SOFT_DIV
    name: "内容多样性"
    dimension: effectiveness
    stage: quality
    method: llm
    prompt_id: content_diversity
    evaluator: soft.content_diversity
    weight: 1.0

  - id: PREF_STYLE
    name: "风格偏好"
    dimension: effectiveness
    stage: quality
    method: llm
    prompt_id: style_preference
    evaluator: pref.style_preference
    weight: 1.0

  - id: PREF_DEPTH
    name: "深度偏好"
    dimension: effectiveness
    stage: quality
    method: llm
    prompt_id: depth_preference
    evaluator: pref.depth_preference
    weight: 1.0

  - id: PREF_REQ
    name: "需求满足"
    dimension: effectiveness
    stage: quality
    method: llm
    prompt_id: request_fulfillment
    evaluator: pref.request_fulfillment
    weight: 1.0

  # ── 多模态视觉（gateway 需预装 Chromium；未装时提交会被 422 拦截）──
  - id: VISION_Q
    name: "视觉质量"
    dimension: effectiveness
    stage: quality
    method: llm_vision
    prompt_id: visual_quality
    evaluator: vision.quality
    params:
      llm_provider: kimi_vision
    weight: 1.0
    enabled: true
