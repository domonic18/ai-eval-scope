version: "1.0"
scenario: courseware
description: "课件质量评估：门控 + 软约束/偏好质量评估（LLM Judge），不含视觉"

dimensions:
  - id: functional
    name: "功能性"
    weight: 1.0
  - id: effectiveness
    name: "效果性"
    weight: 1.0

cascade:
  - stage: format
    name: "格式门控"
    stop_on_fail: true
  - stage: commonsense
    name: "常识门控"
    stop_on_fail: false
  - stage: quality
    name: "质量评估"
    stop_on_fail: false

rules:
  # ── format 门控（HARD_GATE，失败阻塞后续；S_format = 0，Reward 由 [0,1] 归一化体现）──
  - id: FMT_001
    name: "输出格式有效"
    dimension: functional
    stage: format
    description: "SUT 必须生成有效的 Markdown 或 HTML 文件"
    method: format
    format_type: extension
    extensions: ["md", "html"]
    evaluator: format.response_format
    weight: 1.0

  - id: FMT_002
    name: "HTML 有效性"
    dimension: functional
    stage: format
    method: format
    format_type: html_validity
    evaluator: format.html_validity
    params:
      check_html_only: true
    weight: 1.0

  # 空壳/占位文件检测：正文量低于包内中位数 empty_body_ratio 倍且无实质媒体 → 疑似；
  # 疑似文件经 content_verdict LLM 二次确认后判 FAIL。交付不完整是硬伤，任一命中即
  # 门控失败（max_empty_ratio 可按场景放宽容忍比例）。
  - id: FMT_003
    name: "内容完整性"
    dimension: functional
    stage: format
    description: "内容文件不得为空壳/占位（交付不完整 = 不合格）"
    method: format
    format_type: content_completeness
    evaluator: format.content_completeness
    params:
      empty_body_ratio: 0.15
      max_empty_ratio: 0.0
      verification_prompt_id: content_verdict
    weight: 1.0

  # ── commonsense 门控（HARD_SCORE，失败归零本阶段但不阻塞）──
  - id: COMMON_INFO
    name: "知识准确性"
    dimension: functional
    stage: commonsense
    method: rule_set
    # 数据集留空 → 使用全部参考数据集（知识库）；可按需收敛到具体学科
    prompt_id: info_accuracy
    confirmation_prompt_id: fact_verdict
    evaluator: commonsense.info_accuracy
    weight: 1.0
    enabled: true

  - id: COMMON_CHRONO
    name: "时序正确性"
    dimension: functional
    stage: commonsense
    method: llm
    prompt_id: chronological_order
    evaluator: commonsense.chronological_order
    weight: 1.0
    enabled: true

  - id: COMMON_LOGIC
    name: "逻辑一致性"
    dimension: functional
    stage: commonsense
    method: llm
    prompt_id: logical_consistency
    evaluator: commonsense.logical_consistency
    weight: 1.0
    enabled: true

  # ── quality 软约束/偏好（SOFT/PREFERENCE，effectiveness 维度，LLM Judge）──
  - id: SOFT_LOGIC
    name: "教学逻辑"
    dimension: effectiveness
    stage: quality
    method: llm
    prompt_id: pedagogical_logic
    evaluator: soft.teaching_logic
    weight: 1.0

  - id: SOFT_DIV
    name: "内容多样性"
    dimension: effectiveness
    stage: quality
    method: llm
    prompt_id: content_diversity
    evaluator: soft.content_diversity
    weight: 1.0

  - id: PREF_STYLE
    name: "风格偏好"
    dimension: effectiveness
    stage: quality
    method: llm
    prompt_id: style_preference
    evaluator: pref.style_preference
    weight: 1.0

  - id: PREF_DEPTH
    name: "深度偏好"
    dimension: effectiveness
    stage: quality
    method: llm
    prompt_id: depth_preference
    evaluator: pref.depth_preference
    weight: 1.0

  - id: PREF_REQ
    name: "需求满足"
    dimension: effectiveness
    stage: quality
    method: llm
    prompt_id: request_fulfillment
    evaluator: pref.request_fulfillment
    weight: 1.0
