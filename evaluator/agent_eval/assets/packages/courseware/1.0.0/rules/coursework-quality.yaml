version: "1.0"
scenario: courseware
description: "课件质量评估：门控 + 软约束/偏好质量评估（LLM Judge），不含视觉"

dimensions:
  - id: functional
    name: "功能性"
    weight: 1.0
  - id: effectiveness
    name: "效果性"
    weight: 1.0

cascade:
  - stage: format
    name: "格式门控"
    stop_on_fail: true
  - stage: commonsense
    name: "常识门控"
    stop_on_fail: false
  - stage: quality
    name: "质量评估"
    stop_on_fail: false

rules:
  # ── format 门控（HARD_GATE，失败阻塞后续；S_format = 0，Reward 由 [0,1] 归一化体现）──
  - id: FMT_001
    name: "输出格式有效"
    dimension: functional
    stage: format
    description: "SUT 必须生成有效的 Markdown 或 HTML 文件"
    evaluator: format.response_format
    params:
      allowed_formats: ["md", "html"]
    weight: 1.0

  - id: FMT_002
    name: "HTML 有效性"
    dimension: functional
    stage: format
    evaluator: format.html_validity
    params:
      check_html_only: true
    weight: 1.0

  # ── commonsense 门控（HARD_SCORE，失败归零本阶段但不阻塞）──
  - id: COMMON_INFO
    name: "知识准确性"
    dimension: functional
    stage: commonsense
    evaluator: commonsense.info_accuracy
    weight: 1.0
    enabled: true

  - id: COMMON_CHRONO
    name: "时序正确性"
    dimension: functional
    stage: commonsense
    evaluator: commonsense.chronological_order
    weight: 1.0
    enabled: true

  - id: COMMON_LOGIC
    name: "逻辑一致性"
    dimension: functional
    stage: commonsense
    evaluator: commonsense.logical_consistency
    weight: 1.0
    enabled: true

  # ── quality 软约束/偏好（SOFT/PREFERENCE，effectiveness 维度，LLM Judge）──
  - id: SOFT_LOGIC
    name: "教学逻辑"
    dimension: effectiveness
    stage: quality
    evaluator: soft.teaching_logic
    params:
      template_id: pedagogical_logic
    weight: 1.0

  - id: SOFT_DIV
    name: "内容多样性"
    dimension: effectiveness
    stage: quality
    evaluator: soft.content_diversity
    params:
      template_id: content_diversity
    weight: 1.0

  - id: PREF_STYLE
    name: "风格偏好"
    dimension: effectiveness
    stage: quality
    evaluator: pref.style_preference
    params:
      template_id: style_preference
    weight: 1.0

  - id: PREF_DEPTH
    name: "深度偏好"
    dimension: effectiveness
    stage: quality
    evaluator: pref.depth_preference
    params:
      template_id: depth_preference
    weight: 1.0

  - id: PREF_REQ
    name: "需求满足"
    dimension: effectiveness
    stage: quality
    evaluator: pref.request_fulfillment
    params:
      template_id: request_fulfillment
    weight: 1.0
