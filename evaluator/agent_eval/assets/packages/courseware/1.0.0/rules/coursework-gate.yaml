version: "1.0"
scenario: courseware
description: "课件基础评估：格式门控 + 常识门控（LLM 二次确认），不含质量/视觉评估"

dimensions:
  - id: functional
    name: "功能性"
    weight: 1.0

cascade:
  - stage: format
    name: "格式门控"
    stop_on_fail: true
  - stage: commonsense
    name: "常识门控"
    stop_on_fail: false

rules:
  # ── format 门控（HARD_GATE，失败阻塞后续；S_format = 0，Reward 由 [0,1] 归一化体现）──
  - id: FMT_001
    name: "输出格式有效"
    dimension: functional
    stage: format
    description: "SUT 必须生成有效的 Markdown 或 HTML 文件"
    method: format
    format_type: extension
    extensions: ["md", "html"]
    evaluator: format.response_format
    weight: 1.0

  - id: FMT_002
    name: "HTML 有效性"
    dimension: functional
    stage: format
    method: format
    format_type: html_validity
    evaluator: format.html_validity
    params:
      check_html_only: true
    weight: 1.0

  # ── commonsense 门控（HARD_SCORE，失败归零本阶段但不阻塞）──
  - id: COMMON_INFO
    name: "知识准确性"
    dimension: functional
    stage: commonsense
    method: rule_set
    # 数据集留空 → 使用全部参考数据集（知识库）；可按需收敛到具体学科
    prompt_id: info_accuracy
    confirmation_prompt_id: fact_verdict
    evaluator: commonsense.info_accuracy
    weight: 1.0
    enabled: true

  - id: COMMON_CHRONO
    name: "时序正确性"
    dimension: functional
    stage: commonsense
    method: llm
    prompt_id: chronological_order
    evaluator: commonsense.chronological_order
    weight: 1.0
    enabled: true

  - id: COMMON_LOGIC
    name: "逻辑一致性"
    dimension: functional
    stage: commonsense
    method: llm
    prompt_id: logical_consistency
    evaluator: commonsense.logical_consistency
    weight: 1.0
    enabled: true
