# courseware 默认场景配置 — 跨语言单一源（evaluator Python + backend TS 均从此读取）
# 对齐 13 配置管理设计 §10/§七之二；镜像 evaluator defaults.py + backend coursewareDefaults.ts

aggregation_policy:
  id: courseware-default
  scenario_id: courseware
  stage_weights:
    - stage_id: format
      weight: 1.0
      is_gate: true
    - stage_id: commonsense
      weight: 1.0
      is_gate: true
    - stage_id: quality
      weight: 1.0
      is_gate: false
      skip_tiers_in_reward: [hard_gate, hard_score]
      id: soft
      evaluator_weights:
        soft.teaching_logic: 0.5
        soft.content_diversity: 0.5
    - stage_id: quality
      weight: 1.0
      is_gate: false
      skip_tiers_in_reward: [hard_gate, hard_score]
      id: pref
      evaluator_weights:
        pref.style_preference: 0.33
        pref.depth_preference: 0.33
        pref.request_fulfillment: 0.34
  normalize_to: [0.0, 1.0]

metric_definitions:
  - id: courseware:document_rate
    name: 交付率 DR
    expression: "count(format_gate) / total"
    threshold: 0.95
    unit: ratio
    explain:
      title: "DR · Delivery Rate 交付率"
      rows:
        - dt: 定义
          dd: "能正常打开、格式符合基本要求的样本占多少——连格式都不对就没法使用。"
          tone: primary
        - dt: 计算
          dd: "格式合格的样本数 ÷ 全部样本数"
        - dt: 标准
          dd: "达标线 ≥ 0.95（即 95%）；低于则这批整体不合格。"
          tone: danger
  - id: courseware:constraint_pass_rate
    name: 约束通过率 CPR
    expression: "count(both(format_gate, commonsense_gate)) / total"
    threshold: 0.9
    unit: ratio
    explain:
      title: "CPR · Constraint Pass Rate 约束通过率"
      rows:
        - dt: 定义
          dd: "格式 + 常识双门控都通过的样本占比——内容基本正确、无明显硬伤。"
          tone: primary
        - dt: 计算
          dd: "双门控通过样本数 ÷ 全部样本数"
        - dt: 标准
          dd: "达标线 ≥ 0.90；低于则存在较多常识性错误。"
          tone: danger
  - id: courseware:reward
    name: 平均 Reward
    expression: "mean(reward)"
    threshold: 0.7
    unit: score
    explain:
      title: "Reward · 综合评分"
      rows:
        - dt: 定义
          dd: "归一化到 [0,1] 的综合质量分，融合门控与软/偏好质量。"
          tone: primary
        - dt: 计算
          dd: "(S_format + S_common + S_soft + S_pref) / 4"
        - dt: 标准
          dd: "达标线 ≥ 0.70；综合质量合格。"
          tone: success
  - id: courseware:soft
    name: 内容质量
    expression: "mean(s_soft)"
    threshold: null
    unit: score
    explain:
      title: "Soft · 内容质量分"
      rows:
        - dt: 定义
          dd: "教学逻辑、内容多样性等软约束维度的平均得分（独立指标，不混入 Reward）。"
          tone: primary
        - dt: 范围
          dd: "[0, 1]，越高越好"
  - id: courseware:pref
    name: 用户偏好
    expression: "mean(s_pref)"
    threshold: null
    unit: score
    explain:
      title: "Pref · 用户偏好分"
      rows:
        - dt: 定义
          dd: "风格、深度、需求满足度等偏好维度的平均得分（独立指标）。"
          tone: primary
        - dt: 范围
          dd: "[0, 1]，越高越好"
  - id: courseware:conditional_reward
    name: 条件 Reward
    expression: "gated_mean(reward, format_gate, commonsense_gate)"
    threshold: null
    unit: score
    explain:
      title: "CondR · Conditional Reward"
      rows:
        - dt: 定义
          dd: "仅统计通过双门控样本的 Reward 均值——排除格式/常识失败后的真实质量。"
          tone: primary
        - dt: 范围
          dd: "[0, 1]"
