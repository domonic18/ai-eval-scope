[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# distribution 名 ai-eval-scope（agent-eval 在 PyPI 已被占用，arch/17 D-PKG-1）；
# import 名 agent_eval 与 CLI 命令名 agent-eval 不变
name = "ai-eval-scope"
version = "0.2.0"
description = "Agent 能力评估系统 — 基于 Agent-Driven 架构的评测框架"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Agent Eval Team"},
]
keywords = ["agent", "evaluation", "llm", "benchmark", "courseware", "code-generation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
homepage = "https://github.com/domonic18/ai-eval-scope"
repository = "https://github.com/domonic18/ai-eval-scope"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "structlog>=24.0",
    "httpx>=0.27",
    "diskcache>=5.6",
    "markdown>=3.5",
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",
    "jsonschema>=4.21",
    "rich>=13.0",
    "python-dotenv>=1.2.2",
]

# extras 只含用户可安装的功能组合（arch/17 D-PKG-5）——开发工具链在
# [dependency-groups].dev（PEP 735），uv sync --group dev 安装、不入发布元数据
[project.optional-dependencies]
llm = [
    "openai>=1.30",
    "anthropic>=0.30",
    "langfuse>=2.0",
]
# DeepAgents 底座（arch/03 执行引擎 v4.6）：ExecutionAgent Agent-Driven 路径，
# 惰性导入（仿 playwright 惯例），未安装时 CLI/ExecutionAgent 给出友好提示
agent = [
    "deepagents>=0.2",
    "langgraph>=0.4",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
]
vision = [
    "ai-eval-scope[llm]",
    # 精确锁定：与 docker/playwright-base 基础镜像内预装的 chromium 版本严格对齐，
    # 保证 executor 镜像构建时命中已烘焙的 chromium（无需联网下载）。升级时需同步重建基础镜像。
    "playwright==1.60.0",
]
datasets = [
    "huggingface_hub>=0.24",
    "modelscope>=1.18",
    "pyarrow>=24.0.0",
]

[project.scripts]
agent-eval = "agent_eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agent_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "evaluator: 评估器测试",
    "e2e: 端到端测试（真跑管线，慢；-m 'not e2e' 可跳过）",
    "golden: 黄金样本回归测试",
]
addopts = "-v --tb=short"
# 单测试超时兜底（pytest-timeout）：挂死测试 300s 后 fail 并倾倒线程栈，
# 不再无限拖死整套流水线（曾因 httpx 经代理无限读挂 25 分钟）
timeout = 300
timeout_method = "signal"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# UP042: 项目约定统一 (str, Enum) 基类（见 CLAUDE.md），不改 StrEnum
# N806: 函数内常量命名（_UPPER_SNAKE 风格的局部常量）
ignore = ["E501", "UP042", "N806"]

[tool.ruff.lint.per-file-ignores]
# orchestrator 延迟 import 以规避循环依赖
"agent_eval/orchestrator/orchestrator.py" = ["E402"]
# tests 通过 import * 触发评估器注册（副作用）
"tests/evaluators/*.py" = ["F403"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# commitizen：Conventional Commits 校验（commit-msg hook）+ cz bump 版本/CHANGELOG 自动化。
# 版本单源（arch/17 D-PKG-3）：pep621 provider 维护 pyproject [project].version，
# version_files 同步 __init__（scm provider 只读不落盘，且本仓历史无 tag 基线，弃用）
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
version_files = [
    "agent_eval/__init__.py:__version__",
]
annotated_tag = true
# bump 时同步更新 CHANGELOG.md（默认 false——首版 0.1.1 因此漏了 changelog，回填后开启）
update_changelog_on_bump = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "commitizen>=3.29",
    "types-pyyaml>=6.0.12.20260815",
    # 自引用 extras：拉起测试所需的运行时依赖（uv 支持 root 自引用）
    "ai-eval-scope[llm]",
    "ai-eval-scope[vision]",
    "types-jsonschema>=4.26.0.20260518",
    "types-markdown>=3.10.2.20260712",
]
