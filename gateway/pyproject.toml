[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-gateway"
version = "0.1.0"
description = "第三方系统对接的评估接入服务（eval-gateway）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "structlog>=24.1",
    "httpx>=0.27",
    "agent-eval",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
eval-gateway = "eval_gateway.main:run"

# 评估器以路径依赖复用（同仓 ../evaluator），由 uv 解析为 editable。
[tool.uv.sources]
agent-eval = { path = "../evaluator", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["eval_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "unit: 单元测试",
    "integration: 集成测试（需真实 PG，默认 skip）",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "UP042", "N806"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
